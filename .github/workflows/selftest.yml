name: Selftest

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run:
    uses: ./.github/workflows/run-and-notify.yml
    with:
      command: 'python -c "import yaml; print(''yaml-ok'', yaml.__version__)" && echo "SELFTEST_VAR=${SELFTEST_VAR}"'
      title: github-autorun selftest
      env-json: '{"SELFTEST_VAR":"hello-from-env-json"}'
